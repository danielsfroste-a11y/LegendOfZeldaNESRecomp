name: ZeldaUnreal bridge smoke (ROM-free)

on:
  push:
    branches: ["feature/zeldaunreal-bridge-tests"]
  # Push-only to avoid duplicate workflow runs for same-repository PRs.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check integration anchors
        run: python3 tests/check_zeldaunreal_registration.py
      - name: Compile and run actual extension source with mock RAM
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
             tests/zelda_unreal_extension_smoke.c -o /tmp/zelda_unreal_extension_smoke
          /tmp/zelda_unreal_extension_smoke
